plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.3'
group = 'mcscjunjie.junzulaki.trafficmod'

base {
    archivesName = 'junjietrafficmod'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.255'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        junjietrafficmod {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '3000', '-Xmaxwarns', '0'])
}

tasks.register('dumpClasspath') {
    doLast {
        def cp = sourceSets.main.compileClasspath.files.findAll { it.name.endsWith('.jar') && it.exists() }
        new File(rootProject.projectDir, 'cp.txt').text = cp.join(File.pathSeparator)
        def out = new File(rootProject.projectDir, 'cp-index.txt')
        out.text = ''
        cp.each { f ->
            zipTree(f).matching { include '**/*.class' }.each { e ->
                def name = e.toString().substring(f.toString().length() + 1)
                out << name.replace('.class', '').replace('/', '.') + '\n'
            }
        }
        println "WROTE cp.txt(${cp.size()} jars) cp-index.txt entries=${out.readLines().size()}"
    }
}
